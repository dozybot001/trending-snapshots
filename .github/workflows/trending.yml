name: Snapshot GitHub trending
on:
  schedule:
    - cron: '30 23 * * *'   # 07:30 Asia/Shanghai
    - cron: '0 1 * * *'     # 09:00 Asia/Shanghai, in case the first run was delayed
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node fetch.mjs
      - run: |
          git config user.name "trending-bot"
          git config user.email "trending-bot@users.noreply.github.com"
          git add lists
          git diff --cached --quiet || git commit -m "Snapshot $(TZ=Asia/Shanghai date +%F)"
          git push
